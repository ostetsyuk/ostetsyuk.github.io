name: Build & Deploy CV-as-Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup uv (for RenderCV / Typst)
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CV schema & privacy rules
        run: pnpm check

      - name: Build ATS PDF (RenderCV + Typst)
        run: pnpm pdf:build

      - name: Build static Web CV + /llms.txt + /cv.json
        run: pnpm build

      - name: Verify generated artifacts
        run: |
          test -s dist/index.html
          test -s dist/Oleksiy_Stetsyuk_CV.pdf
          test -s dist/llms.txt
          test -s dist/cv.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
