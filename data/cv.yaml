profile:
  name:
    en: Oleksiy Stetsyuk
    ua: Олексій Стецюк
  title:
    en: Senior DevOps / Site Reliability Engineer
    ua: Senior DevOps / Site Reliability Engineer
  subtitle:
    en: Infrastructure Team Lead · Azure & AKS · IaC · Observability · Agentic SRE
    ua: Infrastructure Team Lead · Azure & AKS · IaC · Observability · Agentic SRE
  location:
    en: Ukraine — Remote (UTC+2/+3)
    ua: Україна — Remote (UTC+2/+3)
  availability:
    en: Open to Senior / Staff SRE & DevOps leadership discussions
    ua: Відкритий до пропозицій Senior / Staff SRE & DevOps
  email: stetsyuk.a@gmail.com
  linkedin: https://www.linkedin.com/in/stetsyuk/
  linkedin_label: linkedin.com/in/stetsyuk
  github: https://github.com/stetsyuka
  github_label: github.com/stetsyuka
  summary:
    en: >-
      DevOps and Site Reliability Engineer with 13+ years in production infrastructure, currently leading the SRE team.
      Specialised in Microsoft Azure and hybrid on-premises estates: Kubernetes (AKS), Infrastructure as Code (Terraform,
      Ansible), GitLab CI/CD pipeline engineering, and observability built on Prometheus, Grafana, Zabbix and
      OpenTelemetry. Completed a full migration of the company estate off on-premises infrastructure to Azure, and operate
      a portfolio of 170+ applications and APIs. Track record of replacing manual operations with auditable automation,
      building self-hosted AI-assisted SRE workflows with HashiCorp Vault and MCP observability, and running incident
      response and root-cause analysis for high-availability platforms — including a high-frequency trading (HFT) platform
      and enterprise SaaS. Equally comfortable on Linux and Windows Server, in cloud-native and locally hosted environments.
    ua: >-
      DevOps та Site Reliability Engineer із понад 13 роками досвіду в production-інфраструктурі, наразі очолюю SRE-команду.
      Спеціалізуюсь на Microsoft Azure і гібридних on-premises середовищах: Kubernetes (AKS), Infrastructure as Code
      (Terraform, Ansible), інженерії пайплайнів GitLab CI/CD та observability на базі Prometheus, Grafana, Zabbix і
      OpenTelemetry. Завершив повну міграцію інфраструктури компанії з on-premises в Azure та супроводжую портфель зі
      170+ застосунків і API. Системно замінюю ручні операції аудитованою автоматизацією, розвиваю self-hosted
      AI-агентські SRE-процеси з HashiCorp Vault і MCP-спостережуваністю, веду incident response та RCA для
      high-availability платформ — від high-frequency trading (HFT) до enterprise SaaS. Впевнено працюю як із Linux, так і з
      Windows Server у хмарних і локальних інсталяціях.

