        - Розгортав і супроводжував кластери AKS; пакував і деплоїв мікросервіси у масштабі через Helm-чарти.
        - Перевів інфраструктуру в код (Terraform, Ansible), замінивши ручні збірки на рев'юваний, відтворюваний та аудитований процес.
        - Оптимізував витрати в Azure за рахунок right-sizing, Reserved Instances і безперервного FinOps-моніторингу.
