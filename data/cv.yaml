case_studies:
  - id: gitlab-ci-monitor
    number: "01"
    context:
      en: B2B Soft · Internal Developer Platform
      ua: B2B Soft · Внутрішня DevOps-платформа
    title:
      en: GitLab CI Monitor — Unified Pipeline Observability
      ua: GitLab CI Monitor — Єдина observability пайплайнів
    metric:
      en: 67 GitLab projects · Zero client-side secrets
      ua: 67 GitLab-проєктів · Нуль секретів на клієнті
    summary:
      en: >-
        Designed and shipped an internal pipeline-observability platform used across all infrastructure teams: a React
        SPA on AKS with Entra ID SSO and app-role authorisation, backed by a BFF sidecar that keeps the GitLab service
        token server-side and mirrors real GitLab project permissions for role-aware retry, rerun and cancel actions.
      ua: >-
        Спроєктував і вивів у прод внутрішню платформу спостережуваності пайплайнів для всіх інфраструктурних команд:
        React SPA в AKS з Entra ID SSO та app-role авторизацією і BFF sidecar, який тримає сервісний токен GitLab
        виключно на сервері та дзеркалить реальні права проєктів для рольових retry/rerun/cancel.
    architecture:
      - "Entra ID SSO"
      - "AKS · React SPA"
      - "BFF Sidecar (Token Isolation)"
      - "GitLab API (67 Projects)"
    delivery:
      en: "Delivery: Kaniko → ACR → Trivy + SAST + Secret Scan → Manual Prod Gate → Helm via GitLab K8s Agent (atomic rollout & rollback)."
      ua: "Доставка: Kaniko → ACR → Trivy + SAST + Secret Scan → ручний prod-gate → Helm через GitLab K8s Agent (atomic rollout & rollback)."
    tags: [Azure, AKS, Kubernetes, Helm, GitLab CI/CD, Kaniko, Trivy, Entra ID]

  - id: azure-patching
    number: "02"
    context:
      en: B2B Soft · Cloud Operations Automation
      ua: B2B Soft · Автоматизація хмарних операцій
    title:
      en: Zero-Secret 11-Wave Azure Update Manager Patching
      ua: Zero-Secret 11-хвильовий патчинг в Azure Update Manager
    metric:
      en: 11 waves · OIDC Federation · Auditable Patch Tuesday
      ua: 11 хвиль · OIDC-федерація · Аудитований Patch Tuesday
    summary:
      en: >-
        Replaced host-by-host manual patching with a scheduled, auditable Terraform + GitLab CI/CD pipeline using OIDC
        workload identity federation (no long-lived secrets): tag-based VM auto-enrolment, an 11-wave maintenance matrix,
        and monthly Patch Tuesday-anchored windows with automated bilingual notifications.
      ua: >-
        Замінив ручний патчинг по хостах на плановий аудитований процес через Terraform і GitLab CI/CD з OIDC-федерацією
        (без довгоживучих секретів): автореєстрація VM за тегами, 11-хвильова матриця вікон обслуговування від Patch
        Tuesday та автоматичні двомовні сповіщення.
    architecture:
      - "GitLab CI/CD (OIDC)"
      - "Terraform IaC"
      - "Azure Update Manager"
      - "11-Wave Tag Matrix + Alerts"
    delivery:
      en: "Outcome: Zero static cloud credentials, predictable blast-radius waves, full compliance trail."
      ua: "Результат: жодних статичних ключів, контрольований blast radius по хвилях, повний аудит-трейл."
    tags: [Azure, Terraform, GitLab CI/CD, OIDC, Windows Server, Linux]

  - id: otel-observability
    number: "03"
    context:
      en: B2B Soft · Observability Architecture
      ua: B2B Soft · Архітектура Observability
    title:
      en: Vendor-Neutral OpenTelemetry & SLI/SLO Stack
      ua: Vendor-Neutral OpenTelemetry та SLI/SLO-стек
    metric:
      en: 170+ apps & APIs · No ingestion lock-in
      ua: 170+ сервісів та API · Без vendor lock-in
    summary:
      en: >-
        Designed an OpenTelemetry Collector topology (agent + gateway) to keep production telemetry vendor-neutral and
        avoid irreversible provider lock-in. Rebuilt Grafana, Prometheus and Zabbix dashboards with Entra ID SSO, cut
        alert noise via template tuning and exclusion rules, and formalised a single-source-of-truth registry in Jira & Confluence.
      ua: >-
        Спроєктував топологію OpenTelemetry Collector (agent + gateway) для вендор-нейтрального збору телеметрії без
        lock-in на провайдера. Перезібрав стек Grafana, Prometheus і Zabbix з Entra ID SSO, прибрав шум алертів через
        тюнінг шаблонів і правила виключень та формалізував реєстр 170+ застосунків у Jira і Confluence.
    architecture:
      - "170+ Apps & APIs"
      - "OTel Collector (Agent)"
      - "OTel Gateway"
      - "Prometheus / Grafana / Zabbix"
    delivery:
      en: "Also authored an internal study guide on OpenTelemetry, VictoriaMetrics, SLI/SLO, error budgets & burn-rate alerting."
      ua: "Також написав внутрішній посібник із OpenTelemetry, VictoriaMetrics, SLI/SLO, error budgets і burn-rate alerting."
    tags: [OpenTelemetry, Prometheus, Grafana, Zabbix, VictoriaMetrics, Entra ID]

  - id: agentic-sre-homelab
    number: "04"
    context:
      en: Independent Engineering Lab (2026) · AI-Assisted SRE
      ua: Незалежна інженерна лабораторія (2026) · AI-SRE
    title:
      en: Self-Hosted Multi-Agent SRE Platform & Hybrid Homelab
      ua: Self-Hosted мультиагентна SRE-платформа та гібридний Homelab
    metric:
      en: 13 VMs · 10+ Agents · Vault AppRole · Zero-Trust Tailscale
      ua: 13 VM · 10+ агентів · Vault AppRole · Zero-Trust Tailscale
    summary:
      en: >-
        Built and operate a production-grade private cloud on Proxmox VE 9.2 (13 VMs, Proxmox Backup Server with
        encrypted off-site Google Drive replication and verified restore drills) running a self-hosted multi-agent SRE
        fleet (OpenClaw). Wired live Prometheus MCP diagnostics, Living SRE Runbooks, approval-first execution gates,
        HashiCorp Vault AppRole secret rendering (root-only, zero plaintext agent access), and an automated weekly
        evaluation & tuning harness (Propose → Probe → Compose).
      ua: >-
        Побудував і підтримую приватну хмару на Proxmox VE 9.2 (13 VM, Proxmox Backup Server із шифрованою off-site
        реплікацією в Google Drive і перевіреними restore-drill) із self-hosted флотом мультиагентної SRE-автоматизації
        (OpenClaw). Інтегрував живу діагностику через Prometheus MCP, Living SRE Runbooks, approval-first політики
        виконання, рендеринг секретів із HashiCorp Vault AppRole (лише root) та щотижневий авто-harness оцінювання
        якості агентів (Propose → Probe → Compose).
    architecture:
      - "Proxmox VE 9.2 + PBS"
      - "Tailscale Zero-Trust + Vault"
      - "OpenClaw Multi-Agent SRE"
      - "Prometheus MCP + Harness²"
    delivery:
      en: "Includes Grafana Executive Health dashboards, fail-closed inbound alert webhooks, n8n pipelines & Home Assistant power-resilience automations."
      ua: "Включає дашборди Grafana Executive Health, fail-closed вебхуки алертів, n8n-пайплайни та Home Assistant автоматизації енергонезалежності."
    tags: [Proxmox, HashiCorp Vault, Tailscale, Prometheus, Grafana, MCP, Agentic SRE, OpenClaw, n8n, PostgreSQL, Redis]

experience:
  - id: b2b-lead
    role:
      en: Site Reliability Engineer / Infrastructure Team Lead
      ua: Site Reliability Engineer / Infrastructure Team Lead
    company: B2B Soft
    location:
      en: Remote
      ua: Remote
    period:
      en: Jun 2024 — Present
      ua: Чер 2024 — Дотепер
    bullets:
      en:
        - Own reliability, observability and cloud operations for business-critical SaaS platforms running on Azure and AKS across production and non-production environments.
        - Lead the SRE team (2 engineers) — technical direction, work planning, mentoring, hiring input and performance reviews.
        - Led a nine-month programme that migrated the remaining on-premises estate to Azure, retiring the last locally hosted production workloads and completing the move to fully cloud-hosted infrastructure.
        - Rebuilt the monitoring and observability stack around Grafana, Prometheus and Zabbix — standardised dashboards, cut alert noise by tuning templates and exclusion rules, introduced SLI/SLO and error-budget thinking into alerting design, and wired Grafana SSO through Entra ID with least-privilege Azure service principals.
        - Designed and shipped GitLab CI Monitor, an internal pipeline-observability platform now used across all infrastructure teams — a React SPA on AKS with Entra ID SSO and app-role authorisation, backed by a BFF sidecar keeping the GitLab service token server-side and mirroring real GitLab project permissions across 67 GitLab projects.
        - Built its delivery pipeline end to end — Kaniko image builds to Azure Container Registry, Trivy container scanning plus SAST, secret detection and dependency scanning, and Helm deploys through the GitLab Kubernetes Agent with immutable commit-SHA images, manual production gate, atomic rollout and Helm rollback.
        - Designed an OpenTelemetry Collector topology (agent + gateway) to keep telemetry vendor-neutral, avoiding an irreversible provider lock-in on production ingestion.
        - Automated Azure Update Manager patching with Terraform and GitLab CI/CD using OIDC federation (no long-lived secrets) — tag-based VM auto-enrolment, an 11-wave maintenance matrix and monthly Patch Tuesday-anchored windows with automated bilingual notifications.
        - Formalised the application monitoring process in Jira and Confluence with a single-source-of-truth application registry covering 170+ applications and APIs.
        - Led incident response and root-cause analysis across the edge (Cloudflare / HAProxy), messaging (RabbitMQ, Redis) and Windows Server layers, converting findings into template, alerting and configuration changes that removed classes of repeat alerts at source.
        - Designed and tested disaster recovery procedures with defined RPO/RTO targets for business-critical services.
      ua:
        - Відповідаю за надійність, observability та хмарні операції критичних SaaS-платформ на Azure і AKS у production та non-production середовищах.
        - Очолюю SRE-команду (2 інженери) — технічний напрям, планування, менторинг, участь у наймі та performance reviews.
        - Очолив 9-місячну програму міграції залишків on-premises інфраструктури в Azure, завершивши повний перехід у хмару з виведенням останніх локальних прод-ворклоадів.
        - Перезібрав стек моніторингу й observability на базі Grafana, Prometheus і Zabbix — стандартизував дашборди, знизив шум алертів тюнінгом шаблонів і правил виключень, впровадив SLI/SLO та error budgets і підключив Grafana SSO через Entra ID з least-privilege service principals.
        - Спроєктував і запустив GitLab CI Monitor — внутрішню платформу observability пайплайнів для всіх інфраструктурних команд (React SPA на AKS, Entra ID SSO, BFF sidecar для ізоляції сервісного токена, дзеркалення реальних прав доступу по 67 GitLab-проєктах).
        - Побудував end-to-end delivery pipeline — збірка Kaniko в ACR, сканування Trivy + SAST + secret/dependency detection і деплой Helm через GitLab Kubernetes Agent (immutable commit-SHA образи, ручний prod-gate, atomic rollout та rollback).
        - Спроєктував вендор-нейтральну топологію OpenTelemetry Collector (agent + gateway), уникнувши lock-in на провайдера телеметрії.
        - Автоматизував патчинг в Azure Update Manager через Terraform і GitLab CI/CD з OIDC-федерацією (без статичних секретів) — автореєстрація VM за тегами, 11-хвильова матриця від Patch Tuesday та двомовні сповіщення.
        - Формалізував процес моніторингу застосунків у Jira та Confluence з єдиним реєстром на 170+ сервісів і API.
        - Вів incident response та RCA на рівнях edge (Cloudflare / HAProxy), черг (RabbitMQ, Redis) і Windows Server, усуваючи цілі класи повторних алертів у першопричині.
        - Розробив і протестував процедури disaster recovery із визначеними RPO/RTO для критичних сервісів.
    tech:
      - Azure (AKS, Monitor, Log Analytics, Entra ID, Update Manager, ACR)
